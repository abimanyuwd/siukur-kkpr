<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Meta SEO & Identitas Resmi -->
    <title>SIUKUR-KKPR | Sistem Informasi Uji Kesesuaian dan Pengukuran Ruang</title>
    <meta name="description" content="SIUKUR-KKPR - Sistem Informasi Uji Kesesuaian dan Pengukuran Ruang">

    <!-- Open Graph untuk Pratinjau Sosial Media (WhatsApp, Telegram, dll) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="SIUKUR-KKPR | Sistem Informasi Uji Kesesuaian dan Pengukuran Ruang">
    <meta property="og:description" content="Aplikasi resmi Sistem Informasi Uji Kesesuaian dan Pengukuran Ruang.">
    <meta property="og:image" content="logo.png">

    <!-- Favicon & Touch Icon -->
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="apple-touch-icon" href="logo.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #f8fafc;
            -webkit-font-smoothing: antialiased;
        }

        /* Pembungkus Iframe Layar Penuh */
        .iframe-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            border: none;
            overflow: hidden;
            z-index: 1;
            background-color: #0f172a;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background-color: transparent;
        }

        /* Overlay Loading Screen (Human-Crafted Slate/Navy Aesthetic) */
        #loaderOverlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: linear-gradient(135deg, #0b1120 0%, #0f172a 50%, #1e293b 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        #loaderOverlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 420px;
            width: 100%;
        }

        /* Logo Resmi SIUKUR-KKPR */
        .logo-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .app-logo {
            width: 100px;
            height: 100px;
            border-radius: 22px;
            object-fit: cover;
            box-shadow: 0 16px 36px -8px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }

        .app-title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .app-subtitle {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 500;
            line-height: 1.5;
            max-width: 320px;
            margin-bottom: 26px;
        }

        /* Spinner Ring Halus */
        .spinner {
            width: 34px;
            height: 34px;
            border: 3px solid rgba(148, 163, 184, 0.2);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            font-size: 13px;
            color: #cbd5e1;
            font-weight: 500;
            letter-spacing: 0.01em;
        }

        /* Tombol Cadangan Jika Loading Lambat (Fallback) */
        .fallback-container {
            margin-top: 28px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .fallback-container.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .fallback-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 500;
            color: #94a3b8;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.25);
            padding: 9px 16px;
            border-radius: 10px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .fallback-btn:hover {
            color: #ffffff;
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.12);
        }

        .fallback-btn svg {
            width: 14px;
            height: 14px;
        }
    </style>
</head>

<body>

    <!-- Layar Loading Halus (Splash Screen) -->
    <div id="loaderOverlay">
        <div class="loader-card">
            <div class="logo-wrapper">
                <img src="logo.png" 
                     alt="Logo SIUKUR KKPR" 
                     class="app-logo"
                     onerror="if(!this.dataset.fallback){this.dataset.fallback='1'; this.src='logo.jpg';}">
            </div>
            <h1 class="app-title">SIUKUR - KKPR</h1>
            <p class="app-subtitle">Sistem Informasi Uji Kesesuaian dan Pengukuran Ruang</p>
            <div class="spinner"></div>
            <p class="loading-text" id="statusText">Menghubungkan ke server...</p>

            <!-- Tombol Darurat (Muncul otomatis jika loading melebihi 7 detik) -->
            <div class="fallback-container" id="fallbackBox">
                <a href="https://script.google.com/macros/s/AKfycbzU98ipbWefi4O_vzkkr-HevNr0xrGTc97uuguPnJoE2JWiVLextd1YDPr4cXaiR60Obg/exec" 
                   target="_blank" 
                   rel="noopener noreferrer" 
                   class="fallback-btn">
                    <span>Buka langsung di tab baru</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                        <polyline points="15 3 21 3 21 9"></polyline>
                        <line x1="10" y1="14" x2="21" y2="3"></line>
                    </svg>
                </a>
            </div>
        </div>
    </div>

    <!-- Frame Aplikasi Google Apps Script Layar Penuh -->
    <div class="iframe-container">
        <iframe 
            id="appFrame"
            src="https://script.google.com/macros/s/AKfycbzU98ipbWefi4O_vzkkr-HevNr0xrGTc97uuguPnJoE2JWiVLextd1YDPr4cXaiR60Obg/exec"
            allow="geolocation; camera; microphone; clipboard-read; clipboard-write; fullscreen"
            loading="eager"
            title="Aplikasi SIUKUR KKPR">
        </iframe>
    </div>

    <script>
        (function () {
            const frame = document.getElementById('appFrame');
            const loader = document.getElementById('loaderOverlay');
            const fallbackBox = document.getElementById('fallbackBox');
            const statusText = document.getElementById('statusText');

            let isLoaded = false;

            // Fungsi saat frame selesai memuat
            function hideLoader() {
                if (isLoaded) return;
                isLoaded = true;
                if (loader) {
                    loader.classList.add('hidden');
                    setTimeout(() => {
                        loader.style.display = 'none';
                    }, 400);
                }
            }

            // Dengarkan event load dari iframe
            frame.addEventListener('load', hideLoader);

            // Timeout Pengaman (Bila loading melebihi 7 detik)
            setTimeout(function () {
                if (!isLoaded) {
                    if (statusText) statusText.textContent = "Membutuhkan waktu lebih lama...";
                    if (fallbackBox) fallbackBox.classList.add('visible');
                }
            }, 7000);
        })();
    </script>
</body>

</html>
