<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Meta SEO & Identitas Resmi -->
    <title>SIUKUR-KKPR | Sistem Informasi Uji Kesesuaian dan Pengukuran Ruang</title>
    <meta name="description" content="SIUKUR-KKPR - Sistem Informasi Uji Kesesuaian dan Pengukuran Ruang">

    <!-- Open Graph untuk Pratinjau Sosial Media (WhatsApp, Telegram, dll) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="SIUKUR-KKPR | Sistem Informasi Uji Kesesuaian dan Pengukuran Ruang">
    <meta property="og:description" content="Aplikasi resmi Sistem Informasi Uji Kesesuaian dan Pengukuran Ruang.">
    <meta property="og:image" content="logo.png">

    <!-- Favicon Pintar: Otomatis gunakan logo.png jika ada, atau fallback ke ikon SVG resmi -->
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230f172a'/><path d='M6 22 L11 10 L16 18 L21 12 L26 22 Z' fill='%230284c7' opacity='0.7'/><circle cx='16' cy='13' r='5' fill='%23ea580c'/><circle cx='16' cy='13' r='2' fill='%23ffffff'/><path d='M16 18 L16 23' stroke='%23ea580c' stroke-width='2'/></svg>">
    <link rel="apple-touch-icon" href="logo.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #f8fafc;
            -webkit-font-smoothing: antialiased;
        }

        /* Pembungkus Iframe Layar Penuh */
        .iframe-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            border: none;
            overflow: hidden;
            z-index: 1;
            background-color: #0f172a;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background-color: transparent;
        }

        /* Overlay Loading Screen (Human-Crafted Slate/Navy Aesthetic) */
        #loaderOverlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: linear-gradient(135deg, #0b1120 0%, #0f172a 50%, #1e293b 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        #loaderOverlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 420px;
            width: 100%;
        }

        /* Wadah Logo Pintar (Graceful Fallback) */
        .logo-wrapper {
            position: relative;
            width: 108px;
            height: 108px;
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Gambar Fisik: Disembunyikan dulu sampai benar-benar berhasil dimuat */
        .app-logo {
            display: none;
            width: 100%;
            height: 100%;
            border-radius: 24px;
            object-fit: cover;
            box-shadow: 0 16px 36px -8px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.12);
        }

        /* Fallback Vektor Elegan (Muncul jika file logo.png belum ada di GitHub) */
        .vector-fallback {
            width: 100%;
            height: 100%;
            border-radius: 24px;
            box-shadow: 0 16px 36px -8px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(56, 189, 248, 0.25);
            display: block;
        }

        .app-title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .app-subtitle {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 500;
            line-height: 1.5;
            max-width: 330px;
            margin-bottom: 26px;
        }

        /* Spinner Ring Halus */
        .spinner {
            width: 34px;
            height: 34px;
            border: 3px solid rgba(148, 163, 184, 0.2);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            font-size: 13px;
            color: #cbd5e1;
            font-weight: 500;
            letter-spacing: 0.01em;
        }

        /* Tombol Cadangan Jika Loading Lambat (Fallback) */
        .fallback-container {
            margin-top: 28px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .fallback-container.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .fallback-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 500;
            color: #94a3b8;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.25);
            padding: 9px 16px;
            border-radius: 10px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .fallback-btn:hover {
            color: #ffffff;
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.12);
        }

        .fallback-btn svg {
            width: 14px;
            height: 14px;
        }
    </style>
</head>

<body>

    <!-- Layar Loading Halus (Splash Screen) -->
    <div id="loaderOverlay">
        <div class="loader-card">
            
            <!-- Wadah Logo Bebas Rusak (Anti-Broken Image) -->
            <div class="logo-wrapper">
                <!-- 1. Logo Asli (Aktif otomatis saat file logo.png / logo.jpg di-upload) -->
                <img id="realLogo"
                     src="logo.png" 
                     alt="Logo SIUKUR KKPR" 
                     class="app-logo"
                     onload="onLogoLoaded()"
                     onerror="onLogoError(this)">

                <!-- 2. Logo Vektor Resmi (Tampil mulus jika file fisik belum ada) -->
                <svg id="vectorFallback" class="vector-fallback" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Background Squircle Navy -->
                    <rect width="100" height="100" rx="24" fill="#0d1b2a"/>
                    
                    <!-- Grid Latar Garis Tipis -->
                    <path d="M0 25 H100 M0 50 H100 M0 75 H100 M25 0 V100 M50 0 V100 M75 0 V100" stroke="#1b2a47" stroke-width="0.8" opacity="0.6"/>
                    
                    <!-- Siluet Gedung Kota (Kanan) -->
                    <rect x="66" y="28" width="8" height="24" rx="1" fill="#38bdf8" opacity="0.7"/>
                    <rect x="76" y="24" width="9" height="28" rx="1" fill="#0284c7" opacity="0.9"/>
                    
                    <!-- Siluet Daun Hijau Tata Ruang (Kiri) -->
                    <path d="M34 32 C30 26 36 22 40 26 C40 30 36 34 34 32 Z" fill="#22c55e" opacity="0.9"/>
                    
                    <!-- Siluet Pulau Indonesia (Hijau & Biru) -->
                    <path d="M18 48 C22 42 28 45 32 42 C36 40 42 44 48 41 C54 43 62 40 70 43 C78 45 84 52 80 55 C70 56 60 52 50 54 C40 55 30 52 20 54 Z" fill="#15803d" opacity="0.75"/>
                    <path d="M24 45 C30 43 38 46 44 43 C50 45 58 44 64 45 C58 48 50 49 42 47 C34 49 28 48 24 45 Z" fill="#38bdf8" opacity="0.85"/>
                    
                    <!-- Alat Ukur Theodolite / Tripod & Penggaris Oranye -->
                    <line x1="52" y1="36" x2="62" y2="20" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
                    <path d="M48 38 L54 28 L60 38" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
                    
                    <!-- Pin Lokasi Oranye Utama -->
                    <path d="M50 16 C44 16 39 21 39 27 C39 35 50 46 50 46 C50 46 61 35 61 27 C61 21 56 16 50 16 Z" fill="#ea580c"/>
                    <circle cx="50" cy="26" r="4.5" fill="#ffffff"/>
                    
                    <!-- Emblem Shield Bawah SIUKUR KKPR -->
                    <path d="M14 62 L86 62 L80 82 L50 92 L20 82 Z" fill="#0a192f" stroke="#166534" stroke-width="2"/>
                    <text x="50" y="74" fill="#ffffff" font-size="11" font-weight="900" font-family="sans-serif" text-anchor="middle" letter-spacing="1">SIUKUR</text>
                    <path d="M26 77 H74 L68 86 L50 90 L32 86 Z" fill="#15803d"/>
                    <text x="50" y="86" fill="#ffffff" font-size="8" font-weight="800" font-family="sans-serif" text-anchor="middle" letter-spacing="1.2">KKPR</text>
                </svg>
            </div>

            <h1 class="app-title">SIUKUR - KKPR</h1>
            <p class="app-subtitle">Sistem Informasi Uji Kesesuaian dan Pengukuran Ruang</p>
            <div class="spinner"></div>
            <p class="loading-text" id="statusText">Menghubungkan ke server...</p>

            <!-- Tombol Darurat (Muncul otomatis jika loading melebihi 7 detik) -->
            <div class="fallback-container" id="fallbackBox">
                <a href="https://script.google.com/macros/s/AKfycbzU98ipbWefi4O_vzkkr-HevNr0xrGTc97uuguPnJoE2JWiVLextd1YDPr4cXaiR60Obg/exec" 
                   target="_blank" 
                   rel="noopener noreferrer" 
                   class="fallback-btn">
                    <span>Buka langsung di tab baru</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                        <polyline points="15 3 21 3 21 9"></polyline>
                        <line x1="10" y1="14" x2="21" y2="3"></line>
                    </svg>
                </a>
            </div>
        </div>
    </div>

    <!-- Frame Aplikasi Google Apps Script Layar Penuh -->
    <div class="iframe-container">
        <iframe 
            id="appFrame"
            src="https://script.google.com/macros/s/AKfycbzU98ipbWefi4O_vzkkr-HevNr0xrGTc97uuguPnJoE2JWiVLextd1YDPr4cXaiR60Obg/exec"
            allow="geolocation; camera; microphone; clipboard-read; clipboard-write; fullscreen"
            loading="eager"
            title="Aplikasi SIUKUR KKPR">
        </iframe>
    </div>

    <script>
        // Logika Cerdas Logo (Anti-Broken Image)
        function onLogoLoaded() {
            const realLogo = document.getElementById('realLogo');
            const vectorFallback = document.getElementById('vectorFallback');
            if (realLogo) realLogo.style.display = 'block';
            if (vectorFallback) vectorFallback.style.display = 'none';
        }

        function onLogoError(img) {
            if (!img.dataset.triedJpg) {
                img.dataset.triedJpg = '1';
                img.src = 'logo.jpg';
            } else {
                // Jika logo.png dan logo.jpg keduanya tidak ada, sembunyikan gambar rusak
                img.style.display = 'none';
                const vectorFallback = document.getElementById('vectorFallback');
                if (vectorFallback) vectorFallback.style.display = 'block';
            }
        }

        (function () {
            const frame = document.getElementById('appFrame');
            const loader = document.getElementById('loaderOverlay');
            const fallbackBox = document.getElementById('fallbackBox');
            const statusText = document.getElementById('statusText');

            let isLoaded = false;

            // Fungsi saat frame selesai memuat
            function hideLoader() {
                if (isLoaded) return;
                isLoaded = true;
                if (loader) {
                    loader.classList.add('hidden');
                    setTimeout(() => {
                        loader.style.display = 'none';
                    }, 400);
                }
            }

            // Dengarkan event load dari iframe
            frame.addEventListener('load', hideLoader);

            // Timeout Pengaman (Bila loading melebihi 7 detik)
            setTimeout(function () {
                if (!isLoaded) {
                    if (statusText) statusText.textContent = "Membutuhkan waktu lebih lama...";
                    if (fallbackBox) fallbackBox.classList.add('visible');
                }
            }, 7000);
        })();
    </script>
</body>

</html>
